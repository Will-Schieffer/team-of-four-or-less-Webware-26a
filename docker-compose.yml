services:
  db:
    image: postgres:17
    container_name: utility-finder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: utility_finder
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utility_finder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
